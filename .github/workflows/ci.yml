name: Yuk Main CI

on:
  push:
    branches:
      - main
      - master
    paths-ignore:
      - '**.md'
  pull_request:

jobs:
  verify:
    name: Test, Lint & Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm install

      - name: Run unit & static-export parity tests
        run: npm run test

      - name: Run ESLint
        run: npm run lint

      - name: TypeScript check & static export build
        run: npx tsc --noEmit && npm run build && test -f out/index.html && test -f out/api/index.php && test -f out/.htaccess
