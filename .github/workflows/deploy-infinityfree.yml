name: Deploy Yuk Main Static Frontend to InfinityFree

on:
  push:
    branches:
      - main
      - master
    paths-ignore:
      - 'functions/**'
      - '**.md'
  workflow_dispatch:

# Prevent overlapping uploads from hitting InfinityFree's concurrent FTP connection limit
concurrency:
  group: deploy-infinityfree
  cancel-in-progress: false

jobs:
  build-and-deploy:
    name: Test, Build Static Export & Upload to InfinityFree
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Parse & validate YUK_MAIN_DEPLOY_SECRETS JSON
        id: secrets
        env:
          DEPLOY_SECRETS: ${{ secrets.YUK_MAIN_DEPLOY_SECRETS }}
        run: |
          node -e '
            const fs = require("fs");
            const crypto = require("crypto");

            const raw = process.env.DEPLOY_SECRETS;
            if (!raw || !raw.trim()) {
              console.error("Missing GitHub Secret: YUK_MAIN_DEPLOY_SECRETS");
              process.exit(1);
            }

            let cfg;
            try {
              cfg = JSON.parse(raw);
            } catch (err) {
              console.error("Invalid JSON in YUK_MAIN_DEPLOY_SECRETS:", err.message);
              process.exit(1);
            }

            const mask = (val) => {
              if (!val || typeof val !== "string") return;
              for (const line of val.split(/\r?\n/)) {
                if (line.trim()) console.log("::add-mask::" + line);
              }
            };

            const ftp = cfg.ftp || {};
            const fb = cfg.firebase || {};
            const site = cfg.site || {};

            const requiredFtp = ["server", "username", "password"];
            for (const key of requiredFtp) {
              if (!ftp[key] || typeof ftp[key] !== "string" || !ftp[key].trim()) {
                console.error("Missing required key in YUK_MAIN_DEPLOY_SECRETS: ftp." + key);
                process.exit(1);
              }
            }

            const requiredFb = [
              "apiKey",
              "authDomain",
              "projectId",
              "storageBucket",
              "messagingSenderId",
              "appId",
              "databaseURL"
            ];
            for (const key of requiredFb) {
              if (!fb[key] || typeof fb[key] !== "string" || !fb[key].trim()) {
                console.error("Missing required key in YUK_MAIN_DEPLOY_SECRETS: firebase." + key);
                process.exit(1);
              }
            }

            // Mask sensitive values before exporting to GITHUB_ENV / GITHUB_OUTPUT
            mask(ftp.username);
            mask(ftp.password);
            mask(fb.apiKey);
            if (cfg.firebaseServiceAccount) {
              const sa = typeof cfg.firebaseServiceAccount === "string"
                ? cfg.firebaseServiceAccount
                : JSON.stringify(cfg.firebaseServiceAccount);
              mask(sa);
              if (cfg.firebaseServiceAccount.private_key) {
                mask(cfg.firebaseServiceAccount.private_key);
              }
            }

            // Normalize remote FTP directory (accepts serverDir or server_dir, strips leading ./ or /, rejects ..)
            const rawDirInput =
              typeof ftp.serverDir === "string" && ftp.serverDir.trim()
                ? ftp.serverDir.trim()
                : typeof ftp.server_dir === "string" && ftp.server_dir.trim()
                  ? ftp.server_dir.trim()
                  : "/htdocs/";
            if (rawDirInput.includes("..")) {
              console.error("Invalid ftp.serverDir: path traversal (..) is not allowed.");
              process.exit(1);
            }
            const cleanSegments = rawDirInput.replace(/^(?:\.\/|\/)+|\/+$/g, "");
            const normalizedServerDir = cleanSegments ? `/${cleanSegments}/` : "/htdocs/";

            // Normalize optional FTP protocol (defaults to "ftp" for InfinityFree compatibility; supports "ftps" / "ftps-legacy")
            const rawProtocol = typeof ftp.protocol === "string" && ftp.protocol.trim()
              ? ftp.protocol.trim().toLowerCase()
              : "ftp";
            const allowedProtocols = new Set(["ftp", "ftps", "ftps-legacy"]);
            if (!allowedProtocols.has(rawProtocol)) {
              console.error("Invalid ftp.protocol. Allowed values: ftp, ftps, ftps-legacy.");
              process.exit(1);
            }

            // Normalize optional web basePath ("" for root/addon domain, "/subpath" for subfolder)
            const rawBasePath = typeof site.basePath === "string" ? site.basePath.trim() : "";
            const cleanBase = rawBasePath.replace(/^(?:\.\/|\/)+|\/+$/g, "");
            const normalizedBasePath = cleanBase ? `/${cleanBase}` : "";

            const delim = "EOF_" + crypto.randomBytes(8).toString("hex");
            const writeKV = (filePath, key, value) => {
              fs.appendFileSync(filePath, `${key}<<${delim}\n${value}\n${delim}\n`);
            };

            const envFile = process.env.GITHUB_ENV;
            const outFile = process.env.GITHUB_OUTPUT;

            writeKV(envFile, "NEXT_PUBLIC_FIREBASE_API_KEY", fb.apiKey.trim());
            writeKV(envFile, "NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN", fb.authDomain.trim());
            writeKV(envFile, "NEXT_PUBLIC_FIREBASE_PROJECT_ID", fb.projectId.trim());
            writeKV(envFile, "NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET", fb.storageBucket.trim());
            writeKV(envFile, "NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID", fb.messagingSenderId.trim());
            writeKV(envFile, "NEXT_PUBLIC_FIREBASE_APP_ID", fb.appId.trim());
            writeKV(envFile, "NEXT_PUBLIC_FIREBASE_MEASUREMENT_ID", (fb.measurementId || "").trim());
            writeKV(envFile, "NEXT_PUBLIC_FIREBASE_DATABASE_URL", fb.databaseURL.trim());
            writeKV(envFile, "NEXT_PUBLIC_BASE_PATH", normalizedBasePath);

            writeKV(outFile, "ftp_server", ftp.server.trim());
            writeKV(outFile, "ftp_username", ftp.username.trim());
            writeKV(outFile, "ftp_password", ftp.password);
            writeKV(outFile, "ftp_server_dir", normalizedServerDir);
            writeKV(outFile, "ftp_protocol", rawProtocol);

            console.log(
              "Validated deploy configuration. Protocol:",
              rawProtocol,
              "| Target FTP dir:",
              normalizedServerDir,
              "| basePath:",
              normalizedBasePath || "(root)"
            );
          '

      - name: Install dependencies (Bun)
        run: bun install --frozen-lockfile

      - name: Run Yuk Main engine unit tests
        run: bun run test

      - name: Run ESLint & Firestore rules checks
        run: bun run lint

      - name: Prepare static export tree (exclude preview-only Next.js API routes)
        run: rm -rf app/api

      - name: Build static Next.js export for InfinityFree
        env:
          NODE_ENV: production
          STATIC_EXPORT: 'true'
          NEXT_PUBLIC_GAME_MASTER_MODE: functions
          NEXT_PUBLIC_FIREBASE_FUNCTIONS_REGION: asia-southeast1
        run: bun run build

      - name: Verify static output bundle & sync .htaccess 404 path
        run: |
          test -f out/index.html
          test -f out/.htaccess
          if [ -n "$NEXT_PUBLIC_BASE_PATH" ]; then
            sed -i "s|ErrorDocument 404 /404.html|ErrorDocument 404 ${NEXT_PUBLIC_BASE_PATH}/404.html|g" out/.htaccess
          fi
          ls -la out/

      - name: Upload ./out to InfinityFree via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ steps.secrets.outputs.ftp_server }}
          username: ${{ steps.secrets.outputs.ftp_username }}
          password: ${{ steps.secrets.outputs.ftp_password }}
          protocol: ${{ steps.secrets.outputs.ftp_protocol }}
          port: 21
          security: loose
          timeout: 300000
          local-dir: ./out/
          server-dir: ${{ steps.secrets.outputs.ftp_server_dir }}
          dangerous-clean-slate: false
          exclude: |
            **/.git*
            **/.git*/**
            **/.DS_Store
