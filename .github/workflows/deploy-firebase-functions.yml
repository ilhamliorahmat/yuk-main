name: Deploy Yuk Main Firebase Cloud Functions

on:
  push:
    branches:
      - main
    paths:
      - 'functions/**'
      - 'lib/games/**'
      - 'firebase.json'
      - '.firebaserc'
  workflow_dispatch:

concurrency:
  group: deploy-firebase-functions
  cancel-in-progress: false

jobs:
  deploy-functions:
    name: Build & Deploy Cloud Functions v2 (yuk-main)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Run Spyfall engine unit tests
        run: |
          npm ci
          npm test

      - name: Install & build Cloud Functions
        working-directory: functions
        run: |
          npm install
          npm run build

      - name: Authenticate with Google Cloud / Firebase
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_YUK_MAIN }}

      - name: Deploy Cloud Functions to yuk-main
        run: npx firebase-tools deploy --only functions --project yuk-main --non-interactive
