name: Deploy Yuk Main Firebase Cloud Functions & Rules

on:
  push:
    branches:
      - main
      - master
    paths:
      - 'functions/**'
      - 'lib/games/**'
      - 'firestore.rules'
      - 'database.rules.json'
      - 'firebase.json'
      - '.firebaserc'
  workflow_dispatch:

concurrency:
  group: deploy-firebase-functions
  cancel-in-progress: false

jobs:
  deploy-functions:
    name: Build & Deploy Cloud Functions v2 & Firestore Rules (yuk-main)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Extract & validate Firebase Service Account from YUK_MAIN_DEPLOY_SECRETS
        id: secrets
        env:
          DEPLOY_SECRETS: ${{ secrets.YUK_MAIN_DEPLOY_SECRETS }}
        run: |
          node -e '
            const fs = require("fs");
            const crypto = require("crypto");

            const raw = process.env.DEPLOY_SECRETS;
            if (!raw || !raw.trim()) {
              console.error("Missing GitHub Secret: YUK_MAIN_DEPLOY_SECRETS");
              process.exit(1);
            }

            let cfg;
            try {
              cfg = JSON.parse(raw);
            } catch (err) {
              console.error("Invalid JSON in YUK_MAIN_DEPLOY_SECRETS:", err.message);
              process.exit(1);
            }

            const mask = (val) => {
              if (!val || typeof val !== "string") return;
              for (const line of val.split(/\r?\n/)) {
                if (line.trim()) console.log("::add-mask::" + line);
              }
            };

            const parseServiceAccount = (value) => {
              let current = value;
              for (let depth = 0; depth < 3; depth++) {
                if (typeof current === "string") {
                  const trimmed = current.trim();
                  if (!trimmed) return null;
                  try {
                    current = JSON.parse(trimmed);
                    continue;
                  } catch {
                    try {
                      const decoded = Buffer.from(trimmed, "base64").toString("utf8").trim();
                      if (decoded.startsWith("{")) {
                        current = JSON.parse(decoded);
                        continue;
                      }
                    } catch {
                      return null;
                    }
                    return null;
                  }
                }
                if (current && typeof current === "object" && !Array.isArray(current)) {
                  if (
                    !current.private_key &&
                    current.firebaseServiceAccount &&
                    typeof current.firebaseServiceAccount === "object"
                  ) {
                    current = current.firebaseServiceAccount;
                    continue;
                  }
                  return current;
                }
                return null;
              }
              return current && typeof current === "object" ? current : null;
            };

            const saObj = parseServiceAccount(cfg.firebaseServiceAccount);
            if (!saObj) {
              console.error(
                "firebaseServiceAccount is missing or unreadable inside YUK_MAIN_DEPLOY_SECRETS.\n" +
                "Download the full key from Firebase Console -> Project Settings -> Service accounts -> Generate new private key,\n" +
                "and paste the entire JSON object under \"firebaseServiceAccount\"."
              );
              process.exit(1);
            }

            // Normalize double-escaped newlines in private_key (e.g. \\n -> \n)
            if (typeof saObj.private_key === "string" && saObj.private_key.includes("\\n")) {
              saObj.private_key = saObj.private_key.replace(/\\n/g, "\n");
            }

            const missingFields = [];
            if (saObj.type !== "service_account") missingFields.push("type (must be \"service_account\")");
            if (typeof saObj.client_email !== "string" || !saObj.client_email.includes("@")) {
              missingFields.push("client_email");
            }
            if (
              typeof saObj.private_key !== "string" ||
              !saObj.private_key.includes("BEGIN") ||
              !saObj.private_key.includes("PRIVATE KEY")
            ) {
              missingFields.push("private_key");
            }

            if (missingFields.length > 0) {
              const presentKeys = Object.keys(saObj);
              console.error(
                "Incomplete firebaseServiceAccount inside YUK_MAIN_DEPLOY_SECRETS.\n" +
                "Keys currently present: [" + presentKeys.join(", ") + "]\n" +
                "Missing/invalid required fields: " + missingFields.join(", ") + "\n" +
                "Fix: Go to Firebase Console -> Project Settings -> Service accounts -> Generate new private key,\n" +
                "and replace \"firebaseServiceAccount\" in GitHub Secret YUK_MAIN_DEPLOY_SECRETS with the full downloaded JSON."
              );
              process.exit(1);
            }

            const saJson = JSON.stringify(saObj);
            mask(saJson);
            mask(saObj.client_email);
            mask(saObj.private_key);

            const projectId = (cfg.firebase && cfg.firebase.projectId) || saObj.project_id || "yuk-main";

            const delim = "EOF_" + crypto.randomBytes(8).toString("hex");
            const outFile = process.env.GITHUB_OUTPUT;
            fs.appendFileSync(outFile, `sa_json<<${delim}\n${saJson}\n${delim}\n`);
            fs.appendFileSync(outFile, `project_id<<${delim}\n${projectId}\n${delim}\n`);

            console.log("Validated Firebase Service Account for project:", projectId);
          '

      - name: Run Yuk Main engine unit tests & Firestore rules lint
        run: |
          bun install --frozen-lockfile
          bun run test
          bun run lint

      - name: Install & build Cloud Functions
        working-directory: functions
        run: |
          npm install
          npm run build

      - name: Authenticate with Google Cloud / Firebase
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ steps.secrets.outputs.sa_json }}

      - name: Deploy Cloud Functions & Firestore Rules to Firebase
        run: npx firebase-tools deploy --only functions,firestore:rules --project "${{ steps.secrets.outputs.project_id }}" --non-interactive
