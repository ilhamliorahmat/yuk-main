name: Deploy Yuk Main Firebase Cloud Functions

on:
  push:
    branches:
      - main
      - master
    paths:
      - 'functions/**'
      - 'lib/games/**'
      - 'firebase.json'
      - '.firebaserc'
  workflow_dispatch:

concurrency:
  group: deploy-firebase-functions
  cancel-in-progress: false

jobs:
  deploy-functions:
    name: Build & Deploy Cloud Functions v2 (yuk-main)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Extract Firebase Service Account from YUK_MAIN_DEPLOY_SECRETS
        id: secrets
        env:
          DEPLOY_SECRETS: ${{ secrets.YUK_MAIN_DEPLOY_SECRETS }}
        run: |
          node -e '
            const fs = require("fs");
            const crypto = require("crypto");

            const raw = process.env.DEPLOY_SECRETS;
            if (!raw || !raw.trim()) {
              console.error("Missing GitHub Secret: YUK_MAIN_DEPLOY_SECRETS");
              process.exit(1);
            }

            let cfg;
            try {
              cfg = JSON.parse(raw);
            } catch (err) {
              console.error("Invalid JSON in YUK_MAIN_DEPLOY_SECRETS:", err.message);
              process.exit(1);
            }

            const mask = (val) => {
              if (!val || typeof val !== "string") return;
              for (const line of val.split(/\r?\n/)) {
                if (line.trim()) console.log("::add-mask::" + line);
              }
            };

            if (!cfg.firebaseServiceAccount) {
              console.error("firebaseServiceAccount is not set inside YUK_MAIN_DEPLOY_SECRETS. Add it to auto-deploy Cloud Functions, or deploy manually with: npx firebase-tools deploy --only functions");
              process.exit(1);
            }

            const saObj = typeof cfg.firebaseServiceAccount === "string"
              ? JSON.parse(cfg.firebaseServiceAccount)
              : cfg.firebaseServiceAccount;

            const saJson = JSON.stringify(saObj);
            mask(saJson);
            if (typeof saObj.private_key === "string") {
              mask(saObj.private_key);
            }

            const projectId = (cfg.firebase && cfg.firebase.projectId) || saObj.project_id || "yuk-main";

            const delim = "EOF_" + crypto.randomBytes(8).toString("hex");
            const outFile = process.env.GITHUB_OUTPUT;
            fs.appendFileSync(outFile, `sa_json<<${delim}\n${saJson}\n${delim}\n`);
            fs.appendFileSync(outFile, `project_id<<${delim}\n${projectId}\n${delim}\n`);
          '

      - name: Run Spyfall engine unit tests
        run: |
          bun install --frozen-lockfile
          bun run test

      - name: Install & build Cloud Functions
        working-directory: functions
        run: |
          npm install
          npm run build

      - name: Authenticate with Google Cloud / Firebase
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ steps.secrets.outputs.sa_json }}

      - name: Deploy Cloud Functions to Firebase
        run: npx firebase-tools deploy --only functions --project "${{ steps.secrets.outputs.project_id }}" --non-interactive
